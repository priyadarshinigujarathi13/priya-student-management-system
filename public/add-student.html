<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Student</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><div class="brand">STUDENT<span>HUB</span></div><nav><a href="/">Home</a><a class="active" href="/add-student.html">Add Student</a><a href="/students.html">View Students</a></nav></header>
<main class="page"><div class="page-heading"><p class="eyebrow">NEW RECORD</p><h1>Add Student</h1><p>Enter the student details below.</p></div>
